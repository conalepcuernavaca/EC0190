          { id: 50, question: "En una dirección de correo como 'juan.perez@empresa.com.mx', ¿qué función estructural tiene el símbolo '@' (arroba)?", options: [
            { text: "Señalar que el correo contiene archivos adjuntos pesados.", isCorrect: false },
            { text: "Indicar al sistema operativo que debe abrir un navegador web.", isCorrect: false },
            { text: "Separar el nombre del usuario (juan.perez) del nombre de la organización o dominio (empresa.com.mx).", isCorrect: true },
            { text: "Definir la contraseña secreta de la cuenta de usuario.", isCorrect: false }
          ]},
          { id: 51, question: "¿Qué medio de comunicación en la red se caracteriza por la transmisión instantánea de mensajes de texto en tiempo real?", options: [
            { text: "El sistema de archivos en la nube (Google Drive, OneDrive).", isCorrect: false },
            { text: "El servicio de Chat o mensajería instantánea.", isCorrect: true },
            { text: "La página de historial del navegador.", isCorrect: false },
            { text: "El protocolo de transferencia de archivos FTP.", isCorrect: false }
          ]}
        ];

        // Nuevo componente separado para manejar el estado de carga y error de cada imagen individualmente
        function OptionCard({ option, idx, isAnswered, selectedOptionIdx, onClick, currentQuestionId }) {
            const [imgError, setImgError] = useState(false);

            // Estilos basados en el estado y diseño tipo tarjeta (Card)
            let cardStyle = "bg-white border-4 border-white hover:border-blue-300 shadow-md transform hover:-translate-y-1 hover:shadow-xl transition-all duration-300";
            let textStyle = "text-slate-700";
            
            if (isAnswered) {
              if (option.isCorrect) {
                cardStyle = "bg-green-50 border-4 border-green-500 shadow-lg scale-[1.02]";
                textStyle = "text-green-800";
              } else if (idx === selectedOptionIdx && !option.isCorrect) {
                cardStyle = "bg-red-50 border-4 border-red-500 shadow-lg scale-[1.02]";
                textStyle = "text-red-800";
              } else {
                cardStyle = "bg-white border-4 border-white opacity-60 grayscale scale-100";
              }
            }

            // Ruta local de la imagen (ej. images/q1_opt0.jpg)
            const imgUrl = `images/q${currentQuestionId}_opt${idx}.webp`;

            return (
              <button
                disabled={isAnswered}
                onClick={onClick}
                className={`w-full text-left p-3 rounded-3xl flex flex-col focus:outline-none ${cardStyle}`}
              >
                {/* Contenedor de la Imagen */}
                <div className="relative w-full h-40 md:h-52 rounded-2xl overflow-hidden mb-4 bg-slate-200 shadow-inner flex items-center justify-center">
                  
                  {/* Imagen Local o Mensaje de Error */}
                  {!imgError ? (
                    <img 
                      src={imgUrl} 
                      alt={`Opción ${idx + 1}`} 
                      onError={() => setImgError(true)}
                      className="w-full h-full object-cover relative z-10" 
                    />
                  ) : (
                    <div className="flex flex-col items-center justify-center text-slate-400 p-4 text-center bg-slate-100 w-full h-full">
                      <svg className="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      <span className="text-xs font-mono">Falta imagen:<br/>{imgUrl}</span>
                    </div>
                  )}
                  
                  {/* Iconos de retroalimentación flotantes sobre la imagen */}
                  {isAnswered && option.isCorrect && (
                    <div className="absolute top-3 right-3 bg-green-500 text-white p-2 rounded-full shadow-lg z-30">
                      <svg className="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                  )}
                  {isAnswered && idx === selectedOptionIdx && !option.isCorrect && (
                    <div className="absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full shadow-lg z-30">
                      <svg className="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </div>
                  )}
                </div>
                
                {/* Contenedor del Texto */}
                <div className={`flex-grow flex items-center justify-center text-center font-bold text-sm md:text-base px-2 pb-2 ${textStyle}`}>
                  {option.text}
                </div>
              </button>
            );
        }

        function App() {
          const [appState, setAppState] = useState('welcome'); // welcome, quiz, results
          const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
          const [selectedOptionIdx, setSelectedOptionIdx] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);
          
          // Stats
          const [correctAnswers, setCorrectAnswers] = useState(0);
          const [elapsedTime, setElapsedTime] = useState(0);
          
          // Timer effect
          useEffect(() => {
            let timer;
            if (appState === 'quiz') {
              timer = setInterval(() => {
                setElapsedTime(prev => prev + 1);
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [appState]);

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
          };

          const startQuiz = () => {
            setAppState('quiz');
            setElapsedTime(0);
            setCurrentQuestionIdx(0);
            setCorrectAnswers(0);
            setSelectedOptionIdx(null);
            setIsAnswered(false);
          };

          const handleOptionClick = (index, isCorrect) => {
            if (isAnswered) return; // Prevent multiple clicks

            setSelectedOptionIdx(index);
            setIsAnswered(true);

            if (isCorrect) {
              setCorrectAnswers(prev => prev + 1);
            }
          };

          const nextQuestion = () => {
            if (currentQuestionIdx < questions.length - 1) {
              setCurrentQuestionIdx(prev => prev + 1);
              setSelectedOptionIdx(null);
              setIsAnswered(false);
            } else {
              setAppState('results');
            }
          };

          const currentQuestion = questions[currentQuestionIdx];

          return (
            <div className="min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
              
              {/* PANTALLA DE BIENVENIDA */}
              {appState === 'welcome' && (
                <div className="bg-white max-w-2xl w-full p-8 rounded-2xl shadow-xl text-center space-y-6">
                  <div className="mx-auto w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                    <svg className="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                  </div>
                  <h1 className="text-3xl font-bold text-slate-800">Evaluación Interactiva</h1>
                  <h2 className="text-xl text-slate-600 font-medium">Estándar EC0190: Manejo de aplicaciones e información en equipo de cómputo, nivel básico</h2>
                  
                  <div className="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg my-6 flex items-start text-left">
                    <svg className="w-6 h-6 mr-3 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                      <h3 className="font-bold">¡Atención!</h3>
                      <p className="text-sm mt-1">El tiempo comenzará a correr en cuanto presiones el botón de inicio. Analiza bien cada pregunta y selecciona la opción correcta.</p>
                    </div>
                  </div>

                  <button 
                    onClick={startQuiz}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition-colors shadow-md hover:shadow-lg text-lg"
                  >
                    Iniciar Evaluación
                  </button>
                </div>
              )}

              {/* PANTALLA DEL CUESTIONARIO */}
              {appState === 'quiz' && (
                <div className="bg-white max-w-4xl w-full rounded-2xl shadow-xl overflow-hidden flex flex-col">
                  
                  {/* Header (Progress & Timer) */}
                  <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                    <div className="font-semibold">
                      Pregunta {currentQuestionIdx + 1} de {questions.length}
                    </div>
                    <div className="flex items-center space-x-2 font-mono font-bold text-lg bg-slate-700 py-1 px-3 rounded-lg">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      <span>{formatTime(elapsedTime)}</span>
                    </div>
                  </div>

                  {/* Progress bar */}
                  <div className="h-2 w-full bg-slate-200">
                    <div 
                      className="h-full bg-blue-500 transition-all duration-300"
                      style={{ width: `${((currentQuestionIdx + 1) / questions.length) * 100}%` }}
                    ></div>
                  </div>

                  {/* Question Area */}
                  <div className="p-6 md:p-8 flex-grow bg-slate-50/50">
                    <h2 className="text-xl md:text-3xl font-extrabold text-blue-950 text-center mb-8 leading-tight">
                      {currentQuestion.question}
                    </h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                      {currentQuestion.options.map((option, idx) => (
                        <OptionCard 
                          key={`${currentQuestion.id}-${idx}`}
                          option={option}
                          idx={idx}
                          isAnswered={isAnswered}
                          selectedOptionIdx={selectedOptionIdx}
                          onClick={() => handleOptionClick(idx, option.isCorrect)}
                          currentQuestionId={currentQuestion.id}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Footer Action */}
                  <div className="p-6 bg-slate-50 border-t border-slate-200 flex justify-end">
                    <button
                      onClick={nextQuestion}
                      disabled={!isAnswered}
                      className={`px-8 py-3 rounded-xl font-bold transition-all ${
                        isAnswered 
                          ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-md' 
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      {currentQuestionIdx === questions.length - 1 ? 'Ver Resultados' : 'Siguiente Pregunta'}
                    </button>
                  </div>
                </div>
              )}

              {/* PANTALLA DE RESULTADOS */}
              {appState === 'results' && (
                <div className="bg-white max-w-xl w-full p-8 rounded-2xl shadow-xl text-center">
                  <div className="mb-6">
                    {correctAnswers >= Math.floor(questions.length * 0.7) ? (
                      <div className="mx-auto w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-4">
                        <svg className="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      </div>
                    ) : (
                      <div className="mx-auto w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mb-4">
                        <svg className="w-12 h-12 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      </div>
                    )}
                    
                    <h2 className="text-3xl font-bold text-slate-800 mb-2">¡Evaluación Finalizada!</h2>
                    <p className="text-slate-500">Aquí tienes el resumen de tu desempeño.</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mb-8">
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                      <p className="text-sm text-slate-500 font-semibold mb-1">Aciertos</p>
                      <p className="text-3xl font-bold text-slate-800">
                        <span className="text-green-600">{correctAnswers}</span> / {questions.length}
                      </p>
                    </div>
                    
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                      <p className="text-sm text-slate-500 font-semibold mb-1">Errores</p>
                      <p className="text-3xl font-bold text-slate-800">
                        <span className="text-red-600">{questions.length - correctAnswers}</span>
                      </p>
                    </div>
                    
                    <div className="col-span-2 bg-blue-50 p-4 rounded-xl border border-blue-100 flex items-center justify-center">
                       <svg className="w-6 h-6 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                       <div>
                          <p className="text-sm text-blue-600 font-semibold uppercase tracking-wider">Tiempo Total</p>
                          <p className="text-2xl font-bold text-blue-900">{formatTime(elapsedTime)}</p>
                       </div>
                    </div>
                  </div>

                  <button 
                    onClick={() => setAppState('welcome')}
                    className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl transition-colors shadow-md text-lg"
                  >
                    Reintentar Cuestionario
                  </button>
                </div>
              )}
            </div>
          );
        }

        // Renderizado de la aplicación en el div con id "root"
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
